<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anchor QA v4</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #ececea; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; max-width: 1580px; margin: 0 auto; align-items: start; }
    figure { margin: 0; padding: 14px; border-radius: 22px; background: #fff; }
    figcaption { margin-bottom: 10px; color: #555; font-size: 13px; }
    img { display: block; width: 100%; height: auto; object-fit: contain; object-position: top; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>锚点图</figcaption><img src="/preview/anchor-reference.jpg" alt="锚点图" /></figure>
    <figure><figcaption>新版依恋入口</figcaption><img src="/preview/attachment-intro-v4.png" alt="新版依恋入口" /></figure>
    <figure><figcaption>新版保存与分享</figcaption><img src="/preview/result-share-v4.png" alt="新版分享区" /></figure>
  </main>
</body>
</html>
