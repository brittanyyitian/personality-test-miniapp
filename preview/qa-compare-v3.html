<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Result QA v3</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #ececea; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { display: grid; grid-template-columns: 1.7fr 0.7fr; gap: 24px; align-items: start; max-width: 1500px; margin: 0 auto; }
    figure { margin: 0; padding: 16px; border-radius: 20px; background: #fff; }
    figcaption { margin-bottom: 12px; color: #555; font-size: 14px; }
    img { display: block; width: 100%; height: auto; object-fit: contain; object-position: top; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Selected visual target</figcaption><img src="/preview/source-target.png" alt="Selected visual target" /></figure>
    <figure><figcaption>Current result page</figcaption><img src="/preview/result-qa-v3.png" alt="Current result page" /></figure>
  </main>
</body>
</html>
