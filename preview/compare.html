<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>设计对照</title>
    <style>
      *{box-sizing:border-box}body{margin:0;padding:28px;background:#ececea;color:#222;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}h1{margin:0 0 20px;font-size:22px}h2{margin:24px 0 10px;font-size:15px}.target{width:100%;display:block;border-radius:14px;background:white}.implementations{display:flex;gap:24px;align-items:flex-start}.implementation{width:390px;display:block;border-radius:12px;background:white;box-shadow:0 10px 30px rgba(0,0,0,.08)}.note{margin-top:12px;color:#666}
    </style>
  </head>
  <body>
    <h1>视觉目标与实现对照</h1>
    <h2>选定锚点图</h2>
    <img class="target" src="/preview/source-target.png" alt="选定设计锚点图" />
    <h2>实现截图 · 390px 移动端画布</h2>
    <div class="implementations">
      <img class="implementation" src="/preview/home-qa.png" alt="首页实现" />
      <img class="implementation" src="/preview/result-qa.png" alt="结果页实现" />
    </div>
    <p class="note">结果页实现为一个连续长页面；锚点图将上、中、下三个滚动位置并列展示。</p>
  </body>
</html>
