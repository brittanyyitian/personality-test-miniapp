<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页与结果页视觉验收 v5</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #ececea;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 980px;
      margin: 0 auto;
      align-items: start;
    }
    figure {
      margin: 0;
      padding: 12px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .04);
    }
    figcaption {
      margin: 2px 2px 10px;
      color: #6f6f6b;
      font-size: 13px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: top;
      border-radius: 12px;
    }
    figure:last-child {
      grid-column: 1 / -1;
      width: calc(50% - 9px);
      justify-self: center;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>用户选定的首页锚点</figcaption>
      <img src="/preview/home-selected-source-v5.png" alt="用户选定的首页锚点" />
    </figure>
    <figure>
      <figcaption>新版首页实现：同结构，更浅的柔雾色</figcaption>
      <img src="/preview/home-implementation-v5.png" alt="新版首页实现" />
    </figure>
    <figure>
      <figcaption>新版结果页下半段：纯文字分组与并排分享</figcaption>
      <img src="/preview/result-lower-viewport-v5.png" alt="新版结果页下半段" />
    </figure>
  </main>
</body>
</html>
