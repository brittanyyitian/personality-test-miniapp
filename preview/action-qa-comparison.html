<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>结果页底部操作区对比</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #deddd8; }
    body { max-width: 1000px; margin: 0; padding: 24px; background: #deddd8; color: #24211d; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    h1 { margin: 0 0 18px; font-size: 22px; }
    main { display: grid; grid-template-columns: 1fr 1fr; align-items: flex-start; gap: 20px; }
    figure { min-width: 0; margin: 0; }
    figcaption { margin-bottom: 10px; color: #635e56; font-size: 14px; font-weight: 700; }
    img { width: 100%; display: block; border-radius: 20px; box-shadow: 0 16px 44px rgba(64,58,48,.12); }
    .after { width: auto; }
  </style>
</head>
<body>
  <h1>结果页底部操作区 · 修改前 / 修改后</h1>
  <main>
    <figure>
      <figcaption>修改前：动作纵向散落，双人入口像普通链接</figcaption>
      <img src="/preview/result-actions-before.png" alt="修改前" />
    </figure>
    <figure class="after">
      <figcaption>修改后：主操作、双人功能卡、低频工具三层收口</figcaption>
      <img src="/preview/result-actions-after.png" alt="修改后" />
    </figure>
  </main>
</body>
</html>
