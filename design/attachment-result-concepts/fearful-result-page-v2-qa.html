<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>思考模式母版 × 依恋模式改版对照</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 960px; margin: 0; padding: 26px; background: #dedbd4; color: #201c17; font-family: "PingFang SC", sans-serif; }
    h1 { margin: 0 0 20px; font-size: 24px; }
    .board { display: grid; grid-template-columns: 460px 430px; gap: 18px; align-items: start; }
    figure { margin: 0; padding: 14px; border-radius: 20px; background: #f7f4ee; }
    figure:last-child { padding: 0; overflow: hidden; }
    figcaption { margin-bottom: 12px; color: #70685d; font-size: 12px; font-weight: 700; }
    figure:last-child figcaption { margin: 0; padding: 14px; }
    img { width: 100%; display: block; border-radius: 12px; }
    figure:last-child img { border-radius: 0; }
  </style>
</head>
<body>
  <h1>同一母版：思考模式 → 依恋模式</h1>
  <div class="board">
    <figure><figcaption>用户指定的新版思考模式长页</figcaption><img src="cognitive-long-page-reference.png" alt="思考模式长页参考" /></figure>
    <figure><figcaption>依恋模式改版：同结构、依恋专属内容</figcaption><img src="fearful-result-page-v2.jpg" alt="恐惧—回避型依恋长页" /></figure>
  </div>
</body>
</html>
