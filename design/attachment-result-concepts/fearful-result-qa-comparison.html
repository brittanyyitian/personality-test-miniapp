<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>依恋结果页视觉对照</title>
  <style>
    * { box-sizing: border-box; }
    body { min-width: 1162px; margin: 0; padding: 28px; background: #dcd8cf; color: #17140f; font-family: "PingFang SC", sans-serif; }
    h1 { margin: 0 0 22px; font-size: 24px; white-space: nowrap; }
    .board { display: grid; width: 1106px; grid-template-columns: 650px 430px; gap: 26px; align-items: start; }
    .source { display: grid; width: 650px; gap: 18px; }
    figure { margin: 0; padding: 18px; border-radius: 18px; background: #f8f1e1; }
    figcaption { margin-bottom: 12px; color: #6d665a; font-size: 13px; font-weight: 700; }
    img { display: block; width: 100%; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>依恋结果页视觉对照</h1>
  <div class="board">
    <div class="source">
      <figure>
        <figcaption>画风参考：米白纸张、手绘动物、红黄蓝绿</figcaption>
        <img src="style-reference-secure.jpg" alt="画风参考" />
      </figure>
      <figure>
        <figcaption>本页主视觉：恐惧—回避型依恋</figcaption>
        <img src="attachment-fearful-avoidant-v1.png" alt="恐惧—回避型依恋插画" />
      </figure>
    </div>
    <figure>
      <figcaption>完整结果页：430px 手机宽度</figcaption>
      <img src="fearful-result-page-v1.png" alt="完整结果页长图" />
    </figure>
  </div>
</body>
</html>
